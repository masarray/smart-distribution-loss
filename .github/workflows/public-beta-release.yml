name: Publish Public Engineering Beta

on:
  push:
    branches: ["main"]
    paths:
      - "package.json"
      - "RELEASE_NOTES.md"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/public-beta-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-beta-release
  cancel-in-progress: false

env:
  EXPECTED_VERSION: "0.4.0-beta.1"

jobs:
  publish:
    name: Publish guarded prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version and guard release contract
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "$version" != "$EXPECTED_VERSION" ]]; then
            echo "Package version $version does not match guarded P14 release $EXPECTED_VERSION; skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          grep -Fq "# Smart Distribution Loss v${version}" RELEASE_NOTES.md
          test -f LICENSE
          test -f THIRD_PARTY_NOTICES.md
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Verify release readiness contract
        if: steps.version.outputs.publish == 'true'
        run: node tests/p14-public-release-ci.mjs

      - name: Create GitHub prerelease
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Smart Distribution Loss $TAG — Public Engineering Beta" \
            --notes-file RELEASE_NOTES.md \
            --prerelease
