  workflow_dispatch:

permissions:
  contents: read

jobs:
  p0a-browser:
    name: P0-A + P10 verified correction rerun · Chromium / Pyodide / Pandapower 3φ
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install application dependencies
        run: npm install --no-audit --no-fund

      - name: Build static application at root base
        env:
          VITE_BASE_PATH: /
        run: npm run build

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Start production build server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --directory dist > /tmp/sdl-http.log 2>&1 &
          echo $! > /tmp/sdl-http.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sdl-http.log
          exit 1

      - name: Prove explicit Data & Input drawer interaction
        env:
          SDL_BASE_URL: http://127.0.0.1:8000/
        run: node tests/data-drawer-ci.mjs

      - name: Prove operator-first hierarchy and Engineering View separation
        env:
          SDL_BASE_URL: http://127.0.0.1:8000/
        run: node tests/operation-hierarchy-ci.mjs

      - name: Prove P3 evidence-backed operator decisions
        env:
          SDL_BASE_URL: http://127.0.0.1:8000/
        run: node tests/operator-decision-ci.mjs

      - name: Prove operational SLD and M4 manager intelligence
        env:
          SDL_BASE_URL: http://127.0.0.1:8000/
        run: node tests/operational-sld-ci.mjs

      - name: Prove P6 topology scale, activation gate, navigation, and visible electrical flow
        env:
          SDL_BASE_URL: http://127.0.0.1:8000/
        run: node tests/field-dataset-ci.mjs

      - name: Prove P7 asset intelligence, AC source symbol, and transformer flow continuity
        env:
          SDL_BASE_URL: http://127.0.0.1:8000/
        run: node tests/p7-field-intelligence-ci.mjs

      - name: Prove P8 investigation evidence, related route, and manual checklist workflow
        env:
          SDL_BASE_URL: http://127.0.0.1:8000/
        run: node tests/p8-investigation-ci.mjs

      - name: Prove P9 interval-aligned field measurement reconciliation without physics mutation
        env:
          SDL_BASE_URL: http://127.0.0.1:8000/
        run: node tests/p9-field-measurement-ci.mjs

      - name: Prove P10 versioned verified correction, isolated rerun, before-after comparison, and explicit adoption
        env:
          SDL_BASE_URL: http://127.0.0.1:8000/
        run: node tests/p10-field-correction-ci.mjs

      - name: Run real browser physics gate + warm benchmark
        env:
          SDL_BASE_URL: http://127.0.0.1:8000/
          SDL_TIMEOUT_MS: "600000"
          SDL_ARTIFACT_DIR: artifacts/browser-physics
          SDL_EXPECTED_PANDAPOWER: "3.1.2"
        run: node tests/worker-physics-ci.mjs

      - name: Prove unified 15-minute data contract and independent MV assets
        env:
          SDL_BASE_URL: http://127.0.0.1:8000/
          SDL_TIMEOUT_MS: "600000"
          SDL_ARTIFACT_DIR: artifacts/browser-physics
        run: node tests/mv-independence-ci.mjs

      - name: Upload browser physics diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-physics-${{ github.sha }}
          path: artifacts/browser-physics
          if-no-files-found: warn
          retention-days: 30

      - name: Show static server log on failure
        if: failure()
        run: cat /tmp/sdl-http.log || true
