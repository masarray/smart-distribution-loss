name: Validate Browser Engines

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/demo-ui.js
          node --check web/worker.js
          node --check tests/browser-ci.mjs

      - name: Python syntax
        run: |
          python -m py_compile web/engine/p0a_engine.py
          python -m py_compile web/engine/p0b_engine.py
          python -m py_compile web/engine/p1_ground_truth.py
          python -m py_compile web/engine/p2_degradation.py
          python -m py_compile web/engine/p3_smart_calibration.py
          python -m py_compile web/engine/p3_loss_consistency.py
          python -m py_compile web/engine/demo_spot_load.py

      - name: Public cockpit contract
        run: |
          grep -q 'id="runButton"' web/index.html
          grep -q 'id="qualityPreset"' web/index.html
          grep -q 'id="distributionSld"' web/index.html
          grep -q 'id="demoPipeline"' web/index.html
          grep -q 'id="gateBadge"' web/index.html
          grep -q 'id="diagnostics"' web/index.html
          grep -q './demo-ui.js' web/index.html
          grep -q 'plnDiscussionProof' web/demo-ui.js
          grep -q 'spot_load_demo' web/worker.js

      - name: Required files
        run: |
          test -f web/index.html
          test -f web/styles.css
          test -f web/p3.css
          test -f web/demo-ui.js
          test -f web/engine/demo_spot_load.py
          test -f docs/P0A-GATE.md
          test -f docs/P0B-GATE.md
          test -f docs/P1-GROUND-TRUTH.md
          test -f docs/P2-DATA-DEGRADATION.md
          test -f docs/P3-SMART-CALIBRATION.md
